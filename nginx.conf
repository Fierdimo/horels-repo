server {
    listen 80;
    server_name _;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # Backend API
    # VITE_API_URL=http://server/api → API_URL=http://server/api/hotels
    # Requests arrive as /api/hotels/... → rewrite strips /api → backend receives /hotels/...
    location /api/ {
        rewrite ^/api(/.*) $1 break;
        proxy_pass http://sw2-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Frontend SPA - everything else
    location / {
        proxy_pass http://sw2-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
